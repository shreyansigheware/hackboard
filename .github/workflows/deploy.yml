name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by the daily refresh. A push made with GITHUB_TOKEN does not trigger workflows --
  # GitHub blocks that to prevent runaway recursion -- so the refresh has to ask for the
  # deploy explicitly, or the data updates and the site never republishes.
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to build. The refresh passes main so the build picks up the data commit it just pushed, not the SHA that started the run."
        type: string
        required: false
        default: ""

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate the data before publishing it
        # A broken data file must not reach the site. This is the last gate.
        run: |
          python3 scripts/validate.py data/hackathons.json
          python3 scripts/validate.py data/archive.json
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
