name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The refresh job commits data and this job publishes it, so one deploy at a time, and let a
# newer commit supersede a queued one rather than publishing stale data after fresh data.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate the data before publishing it
        # A broken data file must not reach the site. This is the last gate.
        run: |
          python3 scripts/validate.py data/hackathons.json
          python3 scripts/validate.py data/archive.json
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
