<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable: Android crops to a circle of ~80% of the canvas, so every mark sits inside
       the centre 320px safe zone and the background bleeds to the full square. -->
  <rect width="512" height="512" fill="#0E1116"/>
  <g transform="translate(96 128)">
    <!-- Three stacked cards, the shortest deadline highlighted -- the same idea the list uses. -->
    <rect x="0"   y="0"   width="320" height="68" rx="14" fill="#6E97FF"/>
    <rect x="0"   y="94"  width="320" height="68" rx="14" fill="#2A313C"/>
    <rect x="0"   y="188" width="320" height="68" rx="14" fill="#2A313C"/>
    <rect x="0"   y="0"   width="18"  height="68" rx="9"  fill="#FF6B5A"/>
  </g>
</svg>
